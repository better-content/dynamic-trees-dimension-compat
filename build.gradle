plugins {
    id 'net.minecraftforge.gradle' version '6.0.44'
    id 'eclipse'
    id 'maven-publish'
}

version = project.hasProperty('mod_version') ? project.mod_version : '1.0.0'
group = 'com.bettercontent'
base {
    archivesName = project.property('artifact_name')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', 'dynamic_trees_dimension_compat,minecraft'
        }

        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                dynamic_trees_dimension_compat {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                dynamic_trees_dimension_compat {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                dynamic_trees_dimension_compat {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            args '--mod', 'dynamic_trees_dimension_compat',
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/'),
                 '--existing-mod', 'dynamictrees'
            mods {
                dynamic_trees_dimension_compat {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

if (file('src/gameteststructures').exists()) {
    tasks.register('syncGameTestStructures', Copy) {
        from('src/gameteststructures')
        into(project.file('run-gametest/gameteststructures'))
    }

    tasks.matching { it.name.startsWith('prepareRunGameTestServer') }.configureEach {
        dependsOn(tasks.named('syncGameTestStructures'))
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        url = 'https://harleyoconnor.com/maven'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'
    implementation fg.deobf("com.ferreusveritas.dynamictrees:DynamicTrees-1.20.1:1.4.9")
    runtimeOnly fg.deobf("curse.maven:blue-skies-312918:5010316")
    runtimeOnly fg.deobf("curse.maven:the-undergarden-379849:5182632")
    runtimeOnly fg.deobf("curse.maven:call-from-the-depths-sculk-dimension-1013658:7097966")
    runtimeOnly fg.deobf("curse.maven:the-finley-dimension-remastered-1209777:6527178")
    runtimeOnly fg.deobf("curse.maven:structure-gel-api-378802:5278429")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Optional at runtime if you use DTPlus-only treepack content.
    // runtimeOnly fg.deobf("com.ferreusveritas.dynamictreesplus:DynamicTreesPlus-1.20.1:1.2.1")
}

configurations.named('testRuntimeClasspath') {
    // Unit tests validate resources and placement rules; do not remap game-only dimension jars.
    exclude group: 'curse.maven', module: 'blue-skies-312918'
    exclude group: 'curse.maven', module: 'the-undergarden-379849'
    exclude group: 'curse.maven', module: 'call-from-the-depths-sculk-dimension-1013658'
    exclude group: 'curse.maven', module: 'the-finley-dimension-remastered-1209777'
    exclude group: 'curse.maven', module: 'structure-gel-api-378802'
}

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'     : 'dynamic_trees_dimension_compat',
                'Specification-Vendor'    : 'dynamic_trees_dimension_compat',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'dynamic_trees_dimension_compat',
                'MixinConfigs'            : 'dynamic_trees_dimension_compat.mixins.json'
        ])
    }
}

jar {
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

test {
    useJUnitPlatform()
}

tasks.register('headlessGameTest') {
    group = 'verification'
    description = 'Runs Forge game tests in a headless dedicated server.'
    dependsOn tasks.named('runGameTestServer')
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast deterministic verification lane.'
    dependsOn tasks.named('check')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs the full deterministic verification lane and stages the runtime jar.'
    dependsOn tasks.named('verifyFast')
    dependsOn tasks.named('stageRuntimeJar')
}
